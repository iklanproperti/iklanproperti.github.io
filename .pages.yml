media:
  input: assets/images/properti
  output: /assets/images/properti

content:
  - name: properti
    label: Listing Properti
    type: collection
    path: content/properti
    format: yaml-frontmatter
    filename: "{year}-{month}-{day}-{primary}.md"
    view:
      fields: [title, harga, lokasi, kategori, status]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: "Judul Properti"
        type: string
        required: true
      - name: harga
        label: "Harga (Contoh: Rp 450 Juta / Rp 1,2 M)"
        type: string
        required: true
      - name: kategori
        label: "Kategori Properti"
        type: select
        options:
          values: [Rumah, Kavling Tanah, Ruko, Apartemen, Villa]
        default: Rumah
      - name: status
        label: "Status Penjualan"
        type: select
        options:
          values: [Tersedia, Promo, Booking Fee, Terjual]
        default: Tersedia
      - name: lokasi
        label: "Lokasi atau Kawasan (Contoh: Arcamanik, Bandung)"
        type: string
        required: true
      - name: luas_tanah
        label: "Luas Tanah (m2)"
        type: number
      - name: luas_bangunan
        label: "Luas Bangunan (m2)"
        type: number
      - name: kamar_tidur
        label: "Kamar Tidur"
        type: number
      - name: kamar_mandi
        label: "Kamar Mandi"
        type: number
      - name: legalitas
        label: "Legalitas (SHM / HGB / AJB)"
        type: string
        default: "SHM & PBG"
      - name: gambar_utama
        label: "Foto Utama Properti"
        type: image
        required: true
      - name: galeri
        label: "Galeri Foto Tambahan"
        type: image
        options:
          multiple: true
      - name: fitur_unggulan
        label: "Keunggulan Lokasi dan Fasilitas"
        type: list
      - name: date
        label: "Tanggal Posting"
        type: date
        default: now
      - name: body
        label: "Deskripsi Lengkap dan Skema Pembayaran"
        type: rich-text
