site_name: Info Properti Bandung & Cimahi
description: Platform terpercaya penawaran tanah kavling, rumah, dan rukos investasi di Bandung, Cimahi, Jatinangor, dan Cileunyi.
base_url: https://infoproperti.github.io
contact_whatsapp: "08212334550"
instagram: "@info.jualproperti"

collections:
  - name: properties
    label: "Daftar Properti"
    folder: "_properties"
    create: true
    fields:
      - {label: "Judul Properti", name: "title", widget: "string"}
      - {label: "Kategori", name: "category", widget: "select", options: ["Kavling Tanah", "Rumah", "Rukos"]}
      - {label: "Luas Tanah (m²)", name: "land_area", widget: "number"}
      - {label: "Luas Bangunan (m²)", name: "building_area", widget: "number", required: false}
      - {label: "Harga", name: "price", widget: "string"}
      - {label: "Lokasi", name: "location", widget: "string"}
      - {label: "Deskripsi Singkat", name: "description", widget: "text"}
      - {label: "WhatsApp Kontak", name: "whatsapp", widget: "string", default: "08212334550"}
